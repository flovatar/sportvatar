<?xml version="1.0" encoding="UTF-8"?>
<svg id="EYES" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000">
  <g id="Surprised-Eyes" class="eyes">
    <g class="eyes-inner">
      <defs>
        <style>
            @keyframes blink-shut {
              0% { opacity: 0; }
              50% { opacity: 0; }
              51% { opacity: 1; }
              60% { opacity: 1; }
              61% { opacity: 0; }
              100% { opacity: 0; }
            }

            @keyframes blink-open {
              0% { opacity: 1; }
              50% { opacity: 1; }
              51% { opacity: 0; }
              60% { opacity: 0; }
              61% { opacity: 1; }
              100% { opacity: 1; }
            }

            .eyes-blink {
              animation-duration: 2s;
              animation-name: blink-shut;
              animation-fill-mode: forwards;
              animation-iteration-count: infinite;
            }

            .eye-white,
            .eye-line-top,
            .eye-line-bottom,
            .eyes-pupils {
              animation-duration: 2s;
              animation-name: blink-open;
              animation-fill-mode: forwards;
              animation-iteration-count: infinite;
            }

            /* ----------------------------------
            /* Hide blink by default 
            /* ----------------------------------

            .eyes-blink {
              opacity: 0;
            }

            /* ----------------------------------
        </style>
      </defs>
      <g>
        <g>
          <path class="eye-white" d="M1270.67,948.83c-100.7,211.6,120.3,315.1,248.6,240.6,75.8-45.2,131.1-159.4,33-278.3-122-4.7-166-24.5-281.6,37.7Z" style="fill: #fff;"/>
