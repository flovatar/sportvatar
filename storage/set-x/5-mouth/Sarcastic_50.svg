<?xml version="1.0" encoding="UTF-8"?>
<svg id="MOUTH" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000">
  <g id="Sarcastic-Mouth" class="mouth">
    <defs>
      <style>
        .under-mouth {
          clip-path: url(#facial-hair-mask-mouth);
        }
        @keyframes mouth-shut {
            0% { opacity: 0; }
            50% { opacity: 0; }
            51% { opacity: 1; }
            60% { opacity: 1; }
            61% { opacity: 0; }
            100% { opacity: 0; }
          }

          @keyframes mouth-open {
            0% { opacity: 1; }
            50% { opacity: 1; }
            51% { opacity: 0; }
            60% { opacity: 0; }
            61% { opacity: 1; }
            100% { opacity: 1; }
          }

          .mouth-closed {
            animation-duration: 7s;
            animation-name: mouth-shut;
            animation-fill-mode: forwards;
            animation-iteration-count: infinite;
          }

          .mouth-open {
            animation-duration: 7s;
            animation-name: mouth-open;
            animation-fill-mode: forwards;
            animation-iteration-count: infinite;
          }

          .mouth-closed {
            opacity: 0;
          }
      </style>
