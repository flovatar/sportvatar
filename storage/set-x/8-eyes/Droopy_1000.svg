<?xml version="1.0" encoding="UTF-8"?>
<svg id="EYES" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000">
  <g id="Droopy" class="eyes">
    <g class="eyes-inner">
       <style>
            @keyframes blink-shut {
              0% { opacity: 0; }
              50% { opacity: 0; }
              51% { opacity: 1; }
              60% { opacity: 1; }
              61% { opacity: 0; }
              100% { opacity: 0; }
            }

            @keyframes blink-open {
              0% { opacity: 1; }
              50% { opacity: 1; }
              51% { opacity: 0; }
              60% { opacity: 0; }
              61% { opacity: 1; }
              100% { opacity: 1; }
            }

            .eyes-blink {
              animation-duration: 2s;
              animation-name: blink-shut;
              animation-fill-mode: forwards;
              animation-iteration-count: infinite;
            }

            .eye-white,
            .eye-line,
            .eye-pupils {
              animation-duration: 2s;
              animation-name: blink-open;
              animation-fill-mode: forwards;
              animation-iteration-count: infinite;
            }

            .eye-lines {
              transform: translateY(20px);
            }

            .eyes-blink {
              opacity: 0;
            }
        </style>
