      <style>
        .under-mouth {
          clip-path: url(#static-mouth-mask);
        }
        .snake-tongue-wrapper {
          clip-path: url(#snake-mask);
        }

        @keyframes tongue-pop {
          0% { transform: translate(-25px, -200px) scaleY(1); }
          40% { transform: translate(-25px, -200px) scaleY(1); }
          50% { transform: translate(-10px, 0px) scaleY(1.015); }
          60% { transform: translate(-25px, -200px) scaleY(1); }
          100% { transform: translate(-25px, -200px) scaleY(1); }
        }

        .snake-tongue,
        .tongue-anim-mask {
          animation-duration: 4s;
          animation-name: tongue-pop;
          animation-fill-mode: forwards;
          animation-iteration-count: infinite;
          transform-origin: center top;
          transform-box: fill-box;
        }

        .facial-hair-inner {
          clip-path: url(#tongue-facial-hair-mask);
        }

      </style>
