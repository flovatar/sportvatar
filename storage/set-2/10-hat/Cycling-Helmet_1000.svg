        <style>

          #hair-locs-long-line {
            display: none;
          }

          .hair, .head-extras {
            clip-path: url(#cycle-helmet-hair-mask);
          }
          #Afro-Long-Black,
          #Afro-Long-Brown,
          #Afro-Long-Blonde,
          #Afro-Long-Green {
            clip-path: url(#cycle-helmet-hair-locs-long-mask);
          }

          #Afro-Long-Black ~ #Cycle-Helmet #hair-locs-long-line,
          #Afro-Long-Brown ~ #Cycle-Helmet #hair-locs-long-line,
          #Afro-Long-Blonde ~ #Cycle-Helmet #hair-locs-long-line,
          #Afro-Long-Green ~ #Cycle-Helmet #hair-locs-long-line {
            display: inline;
          }

