  <g id="Tongue-Out" class="mouth">

    <defs>
      <style>
        .under-mouth {
          clip-path: url(#static-mouth-mask);
        }
        
        .tongue-wrapper {
          clip-path: url(#tongue-mask);
        }

        @keyframes tongue-pop {
          0% { transform: translate(-25px, -330px) scaleY(1);}
          15% { transform: translate(-25px, -330px) scaleY(1);}
          20% { transform: translate(-10px, -25px) scaleY(1); }
          25% { transform: translate(-10px, -25px) scaleY(1.01); }
          30% { transform: translate(-10px, -25px) scaleY(1); }
          35% { transform: translate(-10px, -25px) scaleY(1.01); }
          40% { transform: translate(-10px, -25px) scaleY(1); }
          45% { transform: translate(-10px, -25px) scaleY(1.01); }
          50% { transform: translate(-10px, -25px) scaleY(1); }
          55% { transform: translate(-10px, -25px) scaleY(1.01); }
          60% { transform: translate(-10px, -25px) scaleY(1); }
          65% { transform: translate(-10px, -25px) scaleY(1.01); }
          70% { transform: translate(-10px, -25px) scaleY(1); }
          75% { transform: translate(-10px, -25px) scaleY(1.01); }
          80% { transform: translate(-10px, -25px) scaleY(1); }
          90% { transform: translate(-25px, -330px) scaleY(1); }
          100% { transform: translate(-25px, -330px) scaleY(1); }
        }

        .tongue {
          scaleY(1);
        }

        .temp-cover-mask {
          transform: translate(0, 20px);
        }

        .tongue,
        .tongue-anim-mask {
          animation-duration: 6s;
          animation-name: tongue-pop;
          animation-fill-mode: forwards;
          animation-iteration-count: infinite;
          transform-origin: center top;
          transform-box: fill-box;
        }

        #tongue-facial-hair-mask {
          transform: translate(16px, -2px);
        }

        .facial-hair-inner {
          clip-path: url(#tongue-facial-hair-mask);
        }

      </style>

