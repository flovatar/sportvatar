<svg id="ACCESSORY" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3000 3000">
  <g id="Medal-Bronze" class="accessory">
    <defs>
      <style>

        @keyframes shine {
          0% { opacity: 0; }
          50% { opacity: 1; }
          100% { opacity: 0; }
        }

        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        .sparkle {
          animation-duration: 2s;
          animation-name: spin;
          animation-fill-mode: forwards;
          animation-iteration-count: infinite;
          animation-timing-function: linear;
          transform-origin: center;
          transform-box: fill-box; 
        }

        .sparkle1,
        .sparkle2 {
          animation-duration: 3s;
          animation-name: shine;
          animation-fill-mode: forwards;
          animation-iteration-count: infinite;
          transform-origin: center;
          transform-box: fill-box; 
          opacity: 0;
        }

        .sparkle2 {
          animation-delay: 1.5s;
        }

        .medal-color {
          fill: #af5e22;
        }

      </style>
    </defs>
    <g class="under-head">
      <g class="under-hat">
        <g class="under-hair">

